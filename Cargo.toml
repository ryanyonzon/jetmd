[package]
name = "jetmd"
version = "0.1.5"
edition = "2024"
description = "A lightweight Markdown editor"
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://github.com/ryanyonzon/jetmd"
repository = "https://github.com/ryanyonzon/jetmd"
keywords = ["markdown", "editor", "gui", "gtk4"]
categories = ["text-editors"]

[dependencies]
gtk4 = { version = "0.10", features = ["v4_10"] }
sourceview5 = "0.10"
webkit6 = "0.5"
pulldown-cmark = "0.13.1"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "html", "regex-fancy"] }
directories = "6.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.26.0"

[package.metadata.bundle]
name = "jetmd"
identifier = "io.github.ryanyonzon.jetmd"
icon = ["res/icons/*.png"]
copyright = "Copyright (c) 2026 Ryan Yonzon"
category = "public.app-category.productivity"
short_description = "A lightweight Markdown editor"
long_description = """
jetmd is a lightweight Markdown editor with live preview built using GTK4.
It supports syntax highlighting, find and replace, and real-time rendered previews.
"""
linux_mime_types = ["text/markdown", "text/x-markdown"]
linux_exec_args = "%F"
linux_use_terminal = false
deb_depends = [
	"libgtk-4-1",
	"libgtksourceview-5-0",
	"libwebkitgtk-6.0-4",
]
